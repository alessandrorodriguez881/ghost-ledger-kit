[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-kit"
dynamic = ["version"]
description = "Template for financial agent apps that cannot fabricate numbers."
requires-python = ">=3.11"
dependencies = [
    "defusedxml==0.7.1",
    "pandas==3.1.1",
    "pydantic==2.14.3",
    "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "freezegun==1.5.5",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]
# Optional LLM explanation layer (REQ-PKG-07); imported lazily in explainer.py.
llm = [
    "openai==3.46.0",
]
# Developer-only importer of the Banco de España fee Excel (public-fees PF8, DN-PF-24): read by
# scripts/import_bde_fees.py only; never in requirements.txt, never imported at run time.
import = [
    "xlrd==2.0.1",
]

[tool.setuptools.packages.find]
include = ["ledger_kit*"]

[tool.setuptools.package-data]
ledger_kit = ["defaults.toml"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100
# Spec documents under .kiro contain illustrative pseudocode snippets, not real code.
extend-exclude = [".kiro"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "apps"]
